name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Prepare non-secret test configuration
        run: cp config/app.config.example.json config/app.config.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Telegram bot locked dependencies
        run: npm --prefix telegram-bot ci --ignore-scripts

      - name: Audit dependencies and tracked secrets
        run: npm run audit:security

      - name: Type-check and validate source
        run: npm run check

      - name: Type-check Telegram bot
        run: npm run check:telegram-bot

      - name: Run test suite
        run: npm test

      - name: Build production artifacts
        run: npm run build

  deploy:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          }

          require_secret DEPLOY_HOST
          require_secret DEPLOY_USER
          require_secret DEPLOY_SSH_KEY
          require_secret DEPLOY_KNOWN_HOSTS

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/01academy-crm"
          REPO_URL="https://github.com/SheriAkhtamov/01Academy_CRM.git"

          if [ ! -d "$APP_DIR/.git" ]; then
            if [ -e "$APP_DIR" ]; then
              echo "Refusing to replace non-Git path: $APP_DIR" >&2
              exit 1
            fi
            git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin "$REPO_URL"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p config uploads logs .secrets
          chmod 750 config
          chmod 700 .secrets

          python3 <<'PY'
          import json
          import os
          import pathlib
          import secrets
          import urllib.parse

          config_path = pathlib.Path("config/app.config.json")
          password_path = pathlib.Path(".secrets/postgres_password")

          if config_path.exists():
              config = json.loads(config_path.read_text(encoding="utf-8-sig"))
              database_url = str(config.get("database", {}).get("url", ""))
              password = urllib.parse.unquote(urllib.parse.urlsplit(database_url).password or "")
              if not password:
                  raise SystemExit("Database password is missing from config/app.config.json")
          else:
              password = secrets.token_urlsafe(32)
              encoded_password = urllib.parse.quote(password, safe="")
              config = {
                  "database": {
                      "provider": "postgresql",
                      "url": f"postgresql://crm:{encoded_password}@postgres:5432/crm",
                      "ssl": False,
                      "pool": {
                          "max": 20,
                          "idleTimeoutMillis": 30000,
                          "connectionTimeoutMillis": 2000,
                      },
                  },
                  "server": {
                      "environment": "production",
                      "host": "0.0.0.0",
                      "port": 5001,
                      "appUrl": "https://crm.01academy.uz",
                      "trustedProxies": ["loopback", "linklocal", "uniquelocal"],
                  },
                  "session": {
                      "secret": secrets.token_urlsafe(48),
                      "cookieSecure": True,
                  },
                  "email": {
                      "resendApiKey": "",
                      "smtp": {
                          "host": "",
                          "port": 587,
                          "user": "",
                          "pass": "",
                          "from": "",
                      },
                  },
                  "integrations": {
                      "chatplace": {"webhookSecret": secrets.token_urlsafe(32)},
                      "website": {"webhookSecret": secrets.token_urlsafe(32)},
                      "telegram": {"botToken": "", "leadershipChatId": ""},
                      "whatsapp": {
                          "apiToken": "",
                          "phoneNumberId": "",
                          "apiUrl": "https://graph.facebook.com/v19.0",
                      },
                      "instagram": {
                          "appId": "",
                          "appSecret": "",
                          "verifyToken": secrets.token_urlsafe(32),
                          "tokenEncryptionKey": secrets.token_urlsafe(48),
                          "apiVersion": "v25.0",
                          "graphApiUrl": "https://graph.instagram.com",
                          "oauthUrl": "https://www.instagram.com/oauth/authorize",
                      },
                      "metaAds": {
                          "accessToken": "",
                          "marketingAccessToken": "",
                          "capiAccessToken": "",
                          "adAccountId": "",
                          "businessId": "",
                          "datasetId": "",
                          "pageId": "",
                          "apiVersion": "v25.0",
                          "conversionStageCode": "demo_invited",
                          "conversionEventName": "LeadSubmitted",
                          "partnerAgent": "01Academy_CRM",
                          "testEventCode": "",
                      },
                      "notion": {"token": "", "databaseId": ""},
                      "googleSheets": {"credentialsPath": "", "spreadsheetId": ""},
                      "onlinePbx": {
                          "domain": "",
                          "authKey": "",
                          "apiUrl": "https://api2.onlinepbx.ru",
                          "webhookSecret": secrets.token_urlsafe(32),
                      },
                  },
              }
              config_path.write_text(
                  json.dumps(config, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          password_path.write_text(password + "\n", encoding="utf-8")
          os.chmod(config_path, 0o640)
          os.chmod(password_path, 0o600)
          PY

          export APP_CONFIG_GID="$(id -g)"
          BUILD_CONTEXT="$(mktemp -d /tmp/01academy-crm-build.XXXXXX)"
          cleanup_build_context() {
            rm -rf "$BUILD_CONTEXT"
          }
          trap cleanup_build_context EXIT
          git archive --format=tar origin/main | tar -xf - -C "$BUILD_CONTEXT"

          docker compose config --quiet
          docker compose pull postgres
          docker build --pull --tag 01academy-crm:deploy "$BUILD_CONTEXT"
          docker compose up -d --no-build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8011/api/auth/session >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker compose logs --tail=120 crm
              exit 1
            fi

            sleep 2
          done

          docker compose ps
          REMOTE
