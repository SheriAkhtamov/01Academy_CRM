name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: placeholder-password
          POSTGRES_DB: academy_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d academy_lms_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PORTAL_TEST_DATABASE_URL: postgresql://fixture:placeholder-password@127.0.0.1:5432/academy_lms_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Prepare non-secret test configuration
        run: cp config/app.config.example.json config/app.config.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Audit dependencies and tracked secrets
        run: npm run audit:security

      - name: Type-check and validate source
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Build production artifacts
        run: npm run build

  deploy:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          }

          require_secret DEPLOY_HOST
          require_secret DEPLOY_USER
          require_secret DEPLOY_SSH_KEY
          require_secret DEPLOY_KNOWN_HOSTS

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/01academy-crm"
          REPO_URL="https://github.com/SheriAkhtamov/01Academy_CRM.git"
          # Shared with manual deployments, outside the checkout being replaced.
          umask 077
          exec 9>"$HOME/.01academy-crm-deploy.lock"
          flock --exclusive --wait 120 9

          if [ ! -d "$APP_DIR/.git" ]; then
            if [ -e "$APP_DIR" ]; then
              echo "Refusing to replace non-Git path: $APP_DIR" >&2
              exit 1
            fi
            git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin "$REPO_URL"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p config uploads logs backups .secrets
          chmod 750 config
          chmod 770 backups
          chmod 700 .secrets

          python3 <<'PY'
          import json
          import os
          import pathlib
          import secrets
          import urllib.parse

          config_path = pathlib.Path("config/app.config.json")
          password_path = pathlib.Path(".secrets/postgres_password")

          if config_path.exists():
              config = json.loads(config_path.read_text(encoding="utf-8-sig"))
              database_url = str(config.get("database", {}).get("url", ""))
              password = urllib.parse.unquote(urllib.parse.urlsplit(database_url).password or "")
              if not password:
                  raise SystemExit("Database password is missing from config/app.config.json")
          else:
              password = secrets.token_urlsafe(32)
              encoded_password = urllib.parse.quote(password, safe="")
              config = {
                  "database": {
                      "provider": "postgresql",
                      "url": f"postgresql://crm:{encoded_password}@postgres:5432/crm",
                      "ssl": False,
                      "pool": {
                          "max": 20,
                          "idleTimeoutMillis": 30000,
                          "connectionTimeoutMillis": 2000,
                      },
                  },
                  "server": {
                      "environment": "production",
                      "host": "0.0.0.0",
                      "port": 5001,
                      "appUrl": "https://crm.01academy.uz",
                      "trustedProxies": ["loopback", "linklocal", "uniquelocal"],
                  },
                  "session": {
                      "secret": secrets.token_urlsafe(48),
                      "cookieSecure": True,
                  },
                  "email": {
                      "resendApiKey": "",
                      "smtp": {
                          "host": "",
                          "port": 587,
                          "user": "",
                          "pass": "",
                          "from": "",
                      },
                  },
                  "integrations": {
                      "chatplace": {"webhookSecret": secrets.token_urlsafe(32)},
                      "website": {
                          "webhookSecret": secrets.token_urlsafe(32),
                          "allowedFormOrigins": [
                              "https://01academy.pro",
                              "https://www.01academy.pro",
                          ],
                      },
                      "telegram": {"botToken": "", "leadershipChatId": ""},
                      "whatsapp": {
                          "apiToken": "",
                          "phoneNumberId": "",
                          "apiUrl": "https://graph.facebook.com/v19.0",
                      },
                      "instagram": {
                          "appId": "",
                          "appSecret": "",
                          "verifyToken": secrets.token_urlsafe(32),
                          "tokenEncryptionKey": secrets.token_urlsafe(48),
                          "apiVersion": "v25.0",
                          "graphApiUrl": "https://graph.instagram.com",
                          "oauthUrl": "https://www.instagram.com/oauth/authorize",
                      },
                      "metaAds": {
                          "accessToken": "",
                          "marketingAccessToken": "",
                          "capiAccessToken": "",
                          "leadAccessToken": "",
                          "webhookAppSecret": "",
                          "leadWebhookVerifyToken": secrets.token_urlsafe(32),
                          "adAccountId": "",
                          "businessId": "",
                          "datasetId": "",
                          "pageId": "",
                          "apiVersion": "v25.0",
                          "partnerAgent": "01Academy_CRM",
                          "testEventCode": "",
                          "usdToUzsRate": 0,
                      },
                      "notion": {"token": "", "databaseId": ""},
                      "googleSheets": {"credentialsPath": "", "spreadsheetId": ""},
                      "onlinePbx": {
                          "domain": "",
                          "authKey": "",
                          "apiUrl": "https://api2.onlinepbx.ru",
                          "webhookSecret": secrets.token_urlsafe(32),
                      },
                  },
              }

          config_path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          password_path.write_text(password + "\n", encoding="utf-8")
          os.chmod(config_path, 0o640)
          os.chmod(password_path, 0o640)
          PY

          export APP_CONFIG_GID="$(id -g)"
          export BACKUP_GID="$(id -g)"
          BUILD_CONTEXT="$(mktemp -d /tmp/01academy-crm-build.XXXXXX)"
          asset_image_container=""
          cleanup_build_context() {
            if [ -n "$asset_image_container" ]; then
              docker rm -f "$asset_image_container" >/dev/null 2>&1 || true
            fi
            rm -rf "$BUILD_CONTEXT"
          }
          trap cleanup_build_context EXIT
          git archive --format=tar origin/main | tar -xf - -C "$BUILD_CONTEXT"

          docker compose config --quiet
          docker compose pull postgres
          mkdir -p .release-state
          chmod 700 .release-state
          previous_crm_image=""
          if docker container inspect crm-pro >/dev/null 2>&1; then
            previous_crm_image="$(docker inspect crm-pro --format '{{.Image}}')"
            docker image inspect "$previous_crm_image" >/dev/null
            printf '%s\n' "$previous_crm_image" > .release-state/previous-crm-image
            docker tag "$previous_crm_image" 01academy-crm:rollback
          fi
          # Bound the whole builder so compilation cannot displace the live CRM.
          if ! docker buildx inspect academy-lms-safe >/dev/null 2>&1; then
            docker buildx create --name academy-lms-safe --driver docker-container \
              --driver-opt image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea,memory=2g,memory-swap=2g,cpu-quota=100000,cpu-period=100000
          fi
          docker buildx inspect academy-lms-safe --bootstrap >/dev/null
          docker buildx build --builder academy-lms-safe --load --pull --tag 01academy-crm:deploy "$BUILD_CONTEXT"
          release_crm_image="$(docker image inspect 01academy-crm:deploy --format '{{.Id}}')"
          printf '%s\n' "$release_crm_image" > .release-state/current-crm-image
          # Validate runtime file access as the image's default non-root user
          # before changing the running CRM or touching the database.
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --cpus 0.5 --memory 128m \
            --entrypoint node "$release_crm_image" --input-type=module -e '
              import { accessSync, constants, readdirSync } from "node:fs";
              if (process.getuid() === 0) throw new Error("Runtime user must be non-root");
              for (const file of ["package.json", "package-lock.json", "apply-migrations.js",
                "dist/index.js", "dist/learning-api.js", "dist/learning-worker.js",
                "dist/learning-health.js", "migrations/meta/_journal.json",
                "node_modules/pg/package.json", "node_modules/express/package.json"])
                accessSync(`/app/${file}`, constants.R_OK);
              for (const file of readdirSync("/app/migrations"))
                if (file.endsWith(".sql")) accessSync(`/app/migrations/${file}`, constants.R_OK);
              // Vite copies public files with their source permissions. Check
              // every public asset, including files outside the hashed bundles.
              function checkPublicFiles(directory) {
                accessSync(directory, constants.R_OK | constants.X_OK);
                for (const entry of readdirSync(directory, { withFileTypes: true })) {
                  const file = `${directory}/${entry.name}`;
                  if (entry.isDirectory()) checkPublicFiles(file);
                  else accessSync(file, constants.R_OK);
                }
              }
              checkPublicFiles("/app/dist/public");
              console.log("Runtime files are readable by the non-root user.");
            '
          docker buildx build --builder academy-lms-safe --load --pull --tag 01academy-crm-backup:deploy \
            --file "$BUILD_CONTEXT/Dockerfile.db-archive" \
            "$BUILD_CONTEXT"

          # Keep hashed bundles from recent deployments available to tabs that
          # have stayed open while a new CRM image was deployed.
          mkdir -p static-assets
          current_asset_snapshot="$BUILD_CONTEXT/current-assets"
          release_asset_snapshot="$BUILD_CONTEXT/release-assets"
          if docker container inspect crm-pro >/dev/null 2>&1; then
            mkdir -p "$current_asset_snapshot"
            docker cp crm-pro:/app/dist/public/assets/. "$current_asset_snapshot/"
            cp -R "$current_asset_snapshot/." static-assets/
          fi
          mkdir -p "$release_asset_snapshot"
          asset_image_container="$(docker create 01academy-crm:deploy)"
          docker cp "$asset_image_container:/app/dist/public/assets/." "$release_asset_snapshot/"
          cp -R "$release_asset_snapshot/." static-assets/
          docker rm "$asset_image_container" >/dev/null
          asset_image_container=""
          chmod -R a+rX static-assets
          find static-assets -type f -mmin +2880 -delete

          backup_started_at="$(date +%s)"
          docker compose up -d --no-build postgres
          docker compose stop backup >/dev/null 2>&1 || true
          # Older CRM images did not retain committed upload deletions. Stop
          # that image for the rollout snapshot; later backups can stay online.
          crm_backup_legacy_stopped=0
          if docker container inspect crm-pro >/dev/null 2>&1 \
            && ! docker exec crm-pro test -f /app/migrations/0128_generic_funnel_stages_and_qualification.sql; then
            docker compose stop crm
            crm_backup_legacy_stopped=1
          fi
          # The persistent lock also coordinates operator retention pruning.
          if ! docker compose run --rm --no-deps -T \
            --entrypoint /usr/local/bin/create-production-backup \
            backup </dev/null; then
            docker compose up -d --no-build backup || true
            if [ "$crm_backup_legacy_stopped" -eq 1 ]; then
              docker start crm-pro || true
            fi
            exit 1
          fi
          docker compose up -d --no-build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8011/api/auth/session >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker compose logs --tail=120 crm
              if [ -n "$previous_crm_image" ]; then
                # The additive migrations stay in place. Restore only the app image.
                docker tag "$previous_crm_image" 01academy-crm:deploy
                docker compose up -d --no-build --no-deps crm
                printf '%s\n' 'Restored the previous CRM image after failed health checks.' >&2
              fi
              exit 1
            fi

            sleep 2
          done

          if [ ! -f backups/.last-success ]; then
            docker compose logs --tail=120 backup
            exit 1
          fi

          backup_completed_at="$(stat -c %Y backups/.last-success)"
          if [ "$backup_completed_at" -lt "$backup_started_at" ]; then
            docker compose logs --tail=120 backup
            exit 1
          fi

          # Keep the dedicated builder cache bounded after a healthy release.
          docker buildx prune --builder academy-lms-safe --force \
            --max-used-space 2gb > "$BUILD_CONTEXT/build-cache-prune.log"
          tail -n 1 "$BUILD_CONTEXT/build-cache-prune.log"

          docker compose ps
          REMOTE
