name: Sync Meta marketing data

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to refresh
        required: true
        default: '120'
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync Meta catalog and insights over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          META_SYNC_DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS META_SYNC_DAYS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required value: $name" >&2
              exit 1
            fi
          done
          if ! [[ "$META_SYNC_DAYS" =~ ^[0-9]{1,3}$ ]] || [ "$META_SYNC_DAYS" -lt 1 ] || [ "$META_SYNC_DAYS" -gt 365 ]; then
            echo "Sync days must be an integer from 1 to 365" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$META_SYNC_DAYS" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/01academy-crm"
          docker compose exec -T crm \
            node dist/scripts/sync-meta-marketing.js --apply --days "$1"
          REMOTE
