# The scanner receives streams only; application uploads are never mounted here.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogClean no
LogVerbose no
MaxThreads 2
MaxQueue 4
CommandReadTimeout 10
ReadTimeout 60
SendBufTimeout 60
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 20000
AlertExceedsMax yes
HeuristicAlerts yes
AlertOLE2Macros yes
AlertEncrypted yes
ConcurrentDatabaseReload yes
SelfCheck 300
TemporaryDirectory /tmp
