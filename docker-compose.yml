services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: crm
      TZ: UTC
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  crm:
    build: .
    image: 01academy-crm:deploy
    container_name: crm-pro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:5001"
    depends_on:
      postgres:
        condition: service_healthy
    group_add:
      - "${APP_CONFIG_GID:-1000}"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - ACADEMY_TIME_ZONE=Asia/Tashkent
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/api/auth/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    build:
      context: .
      dockerfile: Dockerfile.db-archive
    image: 01academy-crm-backup:deploy
    container_name: crm-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The CRM image writes uploads as the standard Node user (UID 1000).
    # Matching that UID lets the backup read private attachments without
    # broadening their host permissions or running this container as root.
    user: "1000:${BACKUP_GID:-1000}"
    volumes:
      - ./backups:/backups
      - ./uploads:/uploads:ro
      - ./.secrets/postgres_password:/run/secrets/postgres_password:ro
    environment:
      - TZ=UTC
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=crm
      - PGUSER=crm
      - BACKUP_DIR=/backups
      - UPLOADS_DIR=/uploads
      - BACKUP_KEEP=10
      - BACKUP_INTERVAL_SECONDS=3600
      - BACKUP_RETRY_SECONDS=300
      - BACKUP_LOCK_WAIT_SECONDS=3600
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770,uid=1000,gid=${BACKUP_GID:-1000}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /backups/.last-success && age=$$(($$(date +%s) - $$(stat -c %Y /backups/.last-success))) && [ \"$$age\" -lt 7500 ]"
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30m
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
