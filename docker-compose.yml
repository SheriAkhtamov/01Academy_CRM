services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: crm
      TZ: UTC
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  crm:
    build: .
    image: 01academy-crm:deploy
    container_name: crm-pro
    networks: [default, lms_scanner]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:5001"
    depends_on:
      postgres:
        condition: service_healthy
    group_add:
      - "${APP_CONFIG_GID:-1000}"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./static-assets:/app/dist/public/assets:ro
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - ACADEMY_TIME_ZONE=Asia/Tashkent
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/api/auth/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    build:
      context: .
      dockerfile: Dockerfile.db-archive
    image: 01academy-crm-backup:deploy
    container_name: crm-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The CRM image writes uploads as the standard Node user (UID 1000).
    # Matching that UID lets the backup read private attachments without
    # broadening their host permissions or running this container as root.
    user: "1000:${BACKUP_GID:-1000}"
    volumes:
      - ./backups:/backups
      - ./uploads:/uploads:ro
      - ./.secrets/postgres_password:/run/secrets/postgres_password:ro
    environment:
      - TZ=UTC
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=crm
      - PGUSER=crm
      - BACKUP_DIR=/backups
      - UPLOADS_DIR=/uploads
      - BACKUP_KEEP=10
      - BACKUP_INTERVAL_SECONDS=3600
      - BACKUP_RETRY_SECONDS=300
      - BACKUP_LOCK_WAIT_SECONDS=3600
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770,uid=1000,gid=${BACKUP_GID:-1000}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /backups/.last-success && age=$$(($$(date +%s) - $$(stat -c %Y /backups/.last-success))) && [ \"$$age\" -lt 7500 ]"
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30m
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  # Enable only after staging scanner and resource measurements pass.
  clamav:
    image: clamav/clamav:1.4.6-debian@sha256:6d0680780fd29855cb7018f68272cb520821f614259e2066f8ec669069ac91b3
    profiles: [lms-scanner]
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["clamd", "--foreground=true", "--config-file=/etc/clamav/clamd.conf"]
    networks: [lms_scanner]
    volumes:
      - clamav_signatures:/var/lib/clamav:ro
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1770,uid=1000,gid=1000
    cpus: "1.0"
    mem_limit: 3g
    mem_reservation: 1536m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\n' | nc -w 5 127.0.0.1 3310 | grep -q '^PONG'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 6m
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  clamav-updater:
    image: clamav/clamav:1.4.6-debian@sha256:6d0680780fd29855cb7018f68272cb520821f614259e2066f8ec669069ac91b3
    profiles: [lms-scanner-updates]
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["freshclam", "--daemon", "--foreground", "--stdout", "--config-file=/etc/clamav/freshclam.conf"]
    networks: [lms_scanner_updates]
    volumes:
      - clamav_signatures:/var/lib/clamav
      - ./config/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1770,uid=1000,gid=1000
    cpus: "0.5"
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    logging:
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pgdata:
  clamav_signatures:

networks:
  lms_scanner:
    internal: true
  lms_scanner_updates:
    driver: bridge

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
