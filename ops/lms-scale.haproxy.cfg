# Existing TLS ingress sends only to 127.0.0.1:8012, overwriting X-Forwarded-For.
# Request URI, cookies, CSRF, Origin and WebSocket upgrade headers stay unchanged.
global
    log stdout format raw local0
    maxconn 2048
    hard-stop-after 10m

defaults
    mode http
    log global
    option dontlognull
    # Do not log invitation/share tokens or private query strings.
    log-format "%ci:%cp %t %ft %b/%s %ST %B %TR/%Tw/%Tc/%Tr/%Ta"
    timeout connect 5s
    timeout client 10m
    timeout server 10m
    # Header deadline; upload body streams under client/server timeouts.
    timeout http-request 15s
    timeout http-keep-alive 30s
    timeout tunnel 1h
    timeout client-fin 10s
    timeout server-fin 10s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 5s
    hold refused 5s
    hold timeout 5s
    hold obsolete 5s

frontend ingress
    bind :8080
    acl proxy_health path -i /_lms-proxy/live
    http-request return status 200 content-type text/plain string ready if proxy_health
    # Ingress terminates HTTPS and replaces these headers before this hop.
    http-request set-header X-Forwarded-Proto https
    acl reports_path path_reg ^/api/lms-management/(analytics|results|reports)/?$
    acl reports_read method GET HEAD
    acl reports_create path_reg ^/api/lms-management/reports/?$
    acl post method POST
    acl patch method PATCH
    acl file_write path_reg -i ^/api/(portal/files|lms-management/(files|assignments))/?$
    acl profile_write path_reg -i ^/api/portal/me/?$
    acl learner_path path_reg ^/(learn|portfolio/p)(/|$)
    acl learning_api path_reg ^/api/(portal|public/portfolio|lms-management)(/|$)
    acl access_api path_reg ^/api/academy/students/[1-9][0-9]*/portal-access(/|$)
    use_backend uploads if file_write post
    use_backend uploads if profile_write patch
    use_backend reports if reports_path reports_read
    use_backend reports if reports_create post
    use_backend learning if learner_path
    use_backend learning if learning_api
    use_backend learning if access_api
    default_backend crm

backend learning
    balance leastconn
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template api 1-16 learning-api:5001 check inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend reports
    balance leastconn
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template report 1-8 learning-reports:5001 check inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend uploads
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Deliberately one writer; no server-template replica set here.
    server writer learning-upload-api:5001 check inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

backend crm
    option httpchk
    http-check send meth GET uri /api/auth/session ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Existing Compose container/service; never replicate its scheduler.
    server staff crm:5001 check inter 5s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
